name: Build Android APK

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build OpenSMS APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev ccache libjpeg-dev libcairo2-dev

      - name: Cache Buildozer global directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('app/buildozer.spec', 'app/req_android.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install Python build tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.36 buildozer
          pip install -r app/req_android.txt

      - name: Build Android APK with Buildozer
        working-directory: app
        run: |
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSMS-debug-apk
          path: app/bin/*.apk
          retention-days: 14
