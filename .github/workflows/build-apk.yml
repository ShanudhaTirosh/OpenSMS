name: Build Android APK

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: '24'
  ANDROID_MINAPI: '24'
  # python-for-android fork pinned to a commit (was: moving `develop` branch) - update deliberately
  P4A_FORK_REF: 1d2d53739100eac44a310be1204249e1a695e70b

jobs:
  build:
    name: Build OpenSMS APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust toolchain targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev ccache libjpeg-dev libcairo2-dev

      # A debug build is signed with ~/.android/debug.keystore, which is generated fresh on every new runner.
      # Caching it keeps the debug signature stable across runs so test builds install OVER each other
      # (without it Android refuses: "App not installed - conflicts with an existing package").
      # This is for testing only; releases use the real release key (see release.yml).
      - name: Cache debug keystore (stable debug signature for test installs)
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: debug-keystore-v1-${{ github.repository }}

      - name: Cache Buildozer global directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('app/buildozer.spec', 'app/requirements*.txt', 'app/p4a_local_recipes/**', 'app/java_src/**') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install Python build tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.36 buildozer pytest httpx pyyaml
          pip install -r app/req_android.txt -c app/constraints.txt

      - name: Run automated test suite
        env:
          KIVY_NO_ARGS: '1'
          KIVY_WINDOW: 'mock'
          KIVY_NO_CONSOLELOG: '1'
        run: |
          python -m pytest tests -v

      - name: Prepare and patch python-for-android
        run: |
          mkdir -p app/.buildozer/android/platform
          if [ ! -d "app/.buildozer/android/platform/python-for-android" ]; then
            git clone https://github.com/daslearning-org/p4a-unofficial.git app/.buildozer/android/platform/python-for-android
            git -C app/.buildozer/android/platform/python-for-android checkout "$P4A_FORK_REF"
          fi
          python3 app/patch_p4a.py app/.buildozer/android/platform/python-for-android

      - name: Build Android APK with Buildozer
        working-directory: app
        env:
          ANDROID_API_LEVEL: '24'
          ANDROID_MINAPI: '24'
        run: |
          export ANDROID_API_LEVEL=24
          export ANDROID_MINAPI=24
          buildozer android debug

      - name: Show APK checksums
        run: |
          cd app/bin && sha256sum *.apk | tee "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSMS-debug-apk
          path: app/bin/*.apk
          retention-days: 14
