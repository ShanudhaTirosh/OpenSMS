name: Release OpenSMS APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write

env:
  ANDROID_API_LEVEL: '24'
  ANDROID_MINAPI: '24'

jobs:
  release:
    name: Build & Release OpenSMS APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust toolchain targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev ccache libjpeg-dev libcairo2-dev

      - name: Cache Buildozer global directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-release-${{ hashFiles('app/buildozer.spec', 'app/req_android.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-release-

      - name: Install Python build tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.36 buildozer pytest httpx
          pip install -r app/req_android.txt

      - name: Run automated test suite
        run: |
          pytest tests/ -v

      - name: Build Android APK with Buildozer
        working-directory: app
        env:
          ANDROID_API_LEVEL: '24'
          ANDROID_MINAPI: '24'
        run: |
          buildozer android debug

      - name: Inspect generated APK artifacts
        run: |
          ls -la app/bin/

      - name: Determine Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: OpenSMS ${{ steps.get_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: app/bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
